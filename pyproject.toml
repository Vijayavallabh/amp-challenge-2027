[project]
name = "amp-challenge-2027"
version = "0.1.0"
description = "AMP Challenge 2027 submission: generative design of antimicrobial peptides"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vijayavallabh", email = "be23b041@smail.iitm.ac.in" }
]
requires-python = ">=3.11"
dependencies = [
    "levenshtein>=0.27.5",
    "numpy>=2.4.6",
    "torch>=2.14.0",
]

[project.scripts]
generate = "amp_challenge_2027.generate:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
train = [
    "accelerate>=1.15.0",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
]
