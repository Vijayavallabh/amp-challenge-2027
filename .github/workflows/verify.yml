name: verify

# CI mirrors the validator's path but adapts to CPU-only runners: the full-size 50k contract
# and reproducibility checks run on the fast baseline generator, and a small trained-generator
# smoke confirms the neural path loads, produces valid output, and is reproducible. The full
# 50k trained run is a GPU workload and is verified locally / by the organizers' validator.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Full-size contract + reproducibility (baseline generator)
        run: |
          uv run generate --baseline
          md5sum generate/library.fasta generate/top.fasta > first.md5
          uv run generate --baseline > /dev/null
          md5sum -c first.md5

      - name: Submission shape (50k unique, top-100 subset)
        run: |
          library=$(grep -c '^>' generate/library.fasta)
          top=$(grep -c '^>' generate/top.fasta)
          unique=$(grep -v '^>' generate/library.fasta | sort -u | wc -l)
          echo "library=$library top=$top unique=$unique"
          test "$library" -eq 50000
          test "$top" -eq 100
          test "$unique" -eq 50000

      - name: Trained-generator smoke + reproducibility (small, CPU)
        run: |
          uv run generate --n-sequences 128 --top-k 16 --out-dir smoke
          md5sum smoke/library.fasta smoke/top.fasta > smoke.md5
          uv run generate --n-sequences 128 --top-k 16 --out-dir smoke > /dev/null
          md5sum -c smoke.md5
          test "$(grep -c '^>' smoke/library.fasta)" -eq 128
